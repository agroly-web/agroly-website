<script>
  (function () {
    const qty = document.getElementById("id_jumlah");
    const harga = document.getElementById("id_harga_satuan");
    const diskon = document.getElementById("id_diskon_persen");
    const pajak = document.getElementById("id_pajak_persen");
    const totalHarga = document.getElementById("totalHarga");
    const jumlahAkhir = document.getElementById("jumlahAkhir");
    if (!qty || !harga || !diskon || !pajak || !totalHarga || !jumlahAkhir) return;
    const toNum = (v) => parseFloat(String(v).replace(/,/g, "")) || 0;
    const fmt = (n) => window.formatRupiah(n);
    const hitung = () => {
      const subtotal = toNum(qty.value) * toNum(harga.value);
      const diskonNominal = subtotal * (toNum(diskon.value) / 100);
      const dasarPajak = subtotal - diskonNominal;
      const pajakNominal = dasarPajak * (toNum(pajak.value) / 100);
      totalHarga.value = fmt(subtotal);
      jumlahAkhir.value = fmt(dasarPajak + pajakNominal);
    };
    [qty, harga, diskon, pajak].forEach((el) => el.addEventListener("input", hitung));
    hitung();
  })();
</script>
